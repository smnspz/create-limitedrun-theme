{% paginate store.events by 24 %}
  <h2>{{ page.title }}</h2>
  
  <div class="row small-up-1 medium-up-2 large-up-{{ config['grid_items_per_row'] }}">
    {% for event in store.events %}
      {% if event.announced? or event.available? %}
        {% include 'event-item.html' %}
      {% endif %}
    {% endfor %}
  </div>
  
  {{ store.events_pagination }}
{% endpaginate %}
