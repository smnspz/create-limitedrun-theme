{% paginate news.items by 12 %}
<div class="row">
  <div class="large-9 columns">
    <h2>{{ page.title }}</h2>
    
    {% for item in news.items %}
      <article class="row">
        <div class="large-12 columns">
          <h3>{{ item | link_to_news_item }}
            <small>Posted {{ item.published_at | date: "%d %b %Y" }}</small>
          </h3>
          {{ item.body }}
        </div>
      </article>
    {% endfor %}
    
    {{ news.items_pagination }}
  </div>
  
  <aside class="large-3 columns">
    {% include 'sidebar.html' %}
  </aside>
</div>
{% endpaginate %}
