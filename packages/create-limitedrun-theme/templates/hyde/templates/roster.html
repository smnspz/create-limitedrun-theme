{% paginate roster.items by 24 %}
  <h2>{{ page.title }}</h2>

  <div class="row small-up-1 medium-up-2 large-up-{{ config['grid_items_per_row'] }}">
    {% for item in roster.items %}
      <div class="column grid-item">
        <figure>
          <a href="{{ item.url }}">
            <img src="{{ item.images.first.v600_url }}">
          </a>
        </figure>
        
        <div class="grid-item-caption">
          <a class="ellipsis" href="{{ item.url }}">{{ item.name }}</a>
        </div>
      </div>
    {% endfor %}
  </div>
  
  {{ roster.items_pagination }}
{% endpaginate %}
