<div class="column grid-item">
  <figure>
    <a href="{{ product.url }}">
      {% unless config['grid_items_hover_effect'] == 'alternative-image' %}
        <img src="{{ product.images.first.v600_url }}">
        
        {% if config['grid_items_hover_effect'] == 'light-overlay' or config['grid_items_hover_effect'] == 'dark-overlay' %}
          <figcaption class="overlay">
            <div>{{ config['grid_item_overlay_text'] }}</div>
          </figcaption>
        {% endif %}
      {% endunless %}
      
      {% if config['grid_items_hover_effect'] == 'alternative-image' %}
        {% if product.images.size == 1 %}
          <div style="background-image:url('{{ product.images.first.v600_url }}');">
            <img src="https://s9.limitedrun.com/images/1193418/product-image-placeholder-600.png">
          </div>
        {% elsif product.images.size > 1 %}
          <div id="product-{{ product.id }}" style="background-image:url('{{ product.images[0].v600_url }}');"
            onmouseover="document.getElementById('product-{{ product.id }}').style.backgroundImage='url({{ product.images[1].v600_url }})';"
            onmouseout ="document.getElementById('product-{{ product.id }}').style.backgroundImage='url({{ product.images[0].v600_url }})';">
            <img src="https://s9.limitedrun.com/images/1193418/product-image-placeholder-600.png">
          </div>
        {% else %}
          <div>
            <img src="https://s9.limitedrun.com/images/1193418/product-image-placeholder-600.png">
          </div>
        {% endif %}
      {% endif %}
      
      {% if product.preorder? %}<div class="sticker">Pre-Order</div>{% endif %}
    </a>
  </figure>
  
  <div class="grid-item-caption">
    <div class="ellipsis"><a href="{{ product.url }}">{{ product.name }}</a></div>
    <span class="price">{{ product.price_range | money | join: ' - ' }}</span>
  </div>
</div>
