name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Lets npm mint a short-lived OIDC token for trusted publishing (no NPM_TOKEN).
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Trusted publishing (OIDC) and provenance need npm >= 11.5.1.
      - run: npm install -g npm@11
      - run: npm run build
      # Opens/updates a "Version Packages" PR; on merge, publishes to npm.
      - uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
