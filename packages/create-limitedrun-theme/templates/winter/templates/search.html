{% paginate products by 12 %}
  <h2>Search Results</h2>
  {% if products.size > 0 %}
    <ul class="medium-block-grid-2 small-block-grid-1">
      {% for product in products %}
        {% include 'product-item.html' %}
      {% endfor %}
    </ul>
  {% else %}
    <h4>No Results Found</h4>
  {% endif %}
  
  {{ products_pagination }}
{% endpaginate %}
