{% paginate roster.items by 24 %}
  <h2>{{ page.title }}</h2>
  
  <ul class="small-block-grid-2 medium-block-grid-2 large-block-grid-3">
    {% for item in roster.items %}
      <li>
        <a href="{{ item.url }}">
          <div class="overlay-wrapper">
            <img src="{{ item.images.first.v600_url }}" alt="{{ item.name }}" />
            <div class="overlay"><span>{{ item.name }}</span></div>
          </div>
        </a>
      </li>
    {% endfor %}
  </ul>
  
  {{ roster.items_pagination }}
{% endpaginate %}
