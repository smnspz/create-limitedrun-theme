{% paginate category.products by 24 %}
  <h2>{{ category.name }}</h2>
  
  <div class="row small-up-1 medium-up-2 large-up-{{ config['grid_items_per_row'] }} align-middle">
    {% for product in category.products %}
      {% include 'product-item.html' %}
    {% endfor %}
  </div>
  
  {{ category.products_pagination }}
{% endpaginate %}
